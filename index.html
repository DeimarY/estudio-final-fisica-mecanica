<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FBF8F3" />
    <title>Guía de Física</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [["$$", "$$"]],
        },
        svg: { fontCache: "global" },
        options: { enableMenu: false },
      };
    </script>
    <script
      async
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"
    ></script>
    <style>
      :root {
        --bg: #fbf8f3;
        --bg2: #f3eee6;
        --surf: #ffffff;
        --surf2: #faf6f0;
        --text: #2d2a32;
        --muted: #6c6773;
        --line: #e8e1d6;
        --a: #f4b393;
        --at: #fdeee3;
        --ai: #a5481f;
        --s: #a8d4b6;
        --st: #e7f4ec;
        --si: #2e6a47;
        --k: #a5cdeb;
        --kt: #e6f2fa;
        --ki: #2c6890;
        --l: #bdb6ee;
        --lt: #eeebfb;
        --li: #5048a8;
        --b: #f2d58c;
        --bt: #fbf3da;
        --bi: #7a5a12;
        --r: #f2a7b2;
        --rt: #fcebee;
        --ri: #a13a52;
        --ok: #2e6a47;
        --okbg: #e4f3e9;
        --bad: #b03a52;
        --badbg: #fce8ec;
        --mid: #8a6410;
        --midbg: #fbf1d6;
        --onk: #fff;
        --shadow:
          0 1px 2px rgba(70, 45, 20, 0.05), 0 10px 28px rgba(90, 60, 30, 0.07);
        --nav: rgba(251, 248, 243, 0.84);
        --sans:
          "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --serif: "Fraunces", Georgia, "Times New Roman", serif;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1d1c25;
          --bg2: #23222d;
          --surf: #2a2935;
          --surf2: #252430;
          --text: #f0edf4;
          --muted: #a8a3b3;
          --line: #3b3947;
          --a: #e8a27f;
          --at: #3a2b26;
          --ai: #f6b896;
          --s: #8cc3a0;
          --st: #243229;
          --si: #a8d8b9;
          --k: #8dbbdd;
          --kt: #232f3a;
          --ki: #a9d0ee;
          --l: #a9a2e6;
          --lt: #2c2a42;
          --li: #c6c0f6;
          --b: #e2c275;
          --bt: #38311f;
          --bi: #ebd18d;
          --r: #e593a1;
          --rt: #3a2530;
          --ri: #f2a9b6;
          --ok: #a8d8b9;
          --okbg: #24362b;
          --bad: #f2a0af;
          --badbg: #3b2530;
          --mid: #ebd18d;
          --midbg: #38311f;
          --onk: #1d1c25;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.32);
          --nav: rgba(29, 28, 37, 0.82);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1d1c25;
        --bg2: #23222d;
        --surf: #2a2935;
        --surf2: #252430;
        --text: #f0edf4;
        --muted: #a8a3b3;
        --line: #3b3947;
        --a: #e8a27f;
        --at: #3a2b26;
        --ai: #f6b896;
        --s: #8cc3a0;
        --st: #243229;
        --si: #a8d8b9;
        --k: #8dbbdd;
        --kt: #232f3a;
        --ki: #a9d0ee;
        --l: #a9a2e6;
        --lt: #2c2a42;
        --li: #c6c0f6;
        --b: #e2c275;
        --bt: #38311f;
        --bi: #ebd18d;
        --r: #e593a1;
        --rt: #3a2530;
        --ri: #f2a9b6;
        --ok: #a8d8b9;
        --okbg: #24362b;
        --bad: #f2a0af;
        --badbg: #3b2530;
        --mid: #ebd18d;
        --midbg: #38311f;
        --onk: #1d1c25;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.32);
        --nav: rgba(29, 28, 37, 0.82);
        color-scheme: dark;
      }
      .c0 {
        --c: var(--l);
        --t: var(--lt);
        --i: var(--li);
      }
      .c1 {
        --c: var(--a);
        --t: var(--at);
        --i: var(--ai);
      }
      .c2 {
        --c: var(--s);
        --t: var(--st);
        --i: var(--si);
      }
      .c3 {
        --c: var(--k);
        --t: var(--kt);
        --i: var(--ki);
      }
      .c4 {
        --c: var(--b);
        --t: var(--bt);
        --i: var(--bi);
      }
      .c5 {
        --c: var(--r);
        --t: var(--rt);
        --i: var(--ri);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 84px);
        -webkit-text-size-adjust: 100%;
        height: 100%;
        overflow-x: clip;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 400 1.0625rem/1.65 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--nav);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }
      .bgfx {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            52rem 30rem at 92% -6%,
            color-mix(in srgb, var(--l) 34%, transparent),
            transparent 62%
          ),
          radial-gradient(
            42rem 28rem at -6% 18%,
            color-mix(in srgb, var(--a) 26%, transparent),
            transparent 62%
          );
      }
      a {
        color: var(--i, var(--li));
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      mjx-container[display="true"] {
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        margin: 0.6em 0 !important;
        padding: 0.2em 0;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      svg.i {
        width: 1.15em;
        height: 1.15em;
        fill: currentColor;
        flex: none;
      }
      /* nav */
      .nav {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 40;
        background: var(--nav);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        backdrop-filter: blur(18px) saturate(150%);
        border-bottom: 1px solid var(--line);
      }
      .nav .navin {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        height: 60px;
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 clamp(1rem, 3vw, 2rem);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font: 650 1.2rem var(--serif);
        letter-spacing: -0.01em;
        color: var(--text);
      }
      .brand:hover {
        text-decoration: none;
      }
      .brand svg {
        width: 30px;
        height: 30px;
      }
      #cur {
        flex: 1;
        text-align: center;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pill,
      .ib {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--surf);
        color: var(--text);
        font: 600 0.9rem var(--sans);
        border-radius: 999px;
        height: 40px;
        padding: 0 1.05rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          background 0.2s,
          filter 0.2s;
      }
      .ib {
        width: 40px;
        padding: 0;
        justify-content: center;
      }
      .pill:hover,
      .ib:hover {
        filter: brightness(0.97);
      }
      .pill:active,
      .ib:active,
      .cut:active {
        transform: scale(0.97);
        transition: transform 90ms ease-out;
      }
      .pill.pri {
        background: var(--i, var(--li));
        color: var(--onk);
        border-color: transparent;
      }
      .bar {
        position: absolute;
        left: 0;
        bottom: -1px;
        height: 3px;
        width: 100%;
        transform-origin: 0 50%;
        transform: scaleX(0);
        background: linear-gradient(90deg, var(--a), var(--l), var(--k));
      }
      /* hero */
      .hwrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 clamp(1rem, 3vw, 2rem);
      }
      .hero {
        padding: clamp(2.2rem, 6vw, 4.5rem) 0 clamp(1.5rem, 4vw, 2.5rem);
      }
      .hgrid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 2rem;
        align-items: center;
      }
      .eyebrow {
        display: inline-block;
        padding: 0.4rem 0.95rem;
        border-radius: 999px;
        background: var(--lt);
        color: var(--li);
        font-weight: 650;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }
      .display {
        margin: 1.1rem 0 0;
        font: 650 clamp(2.5rem, 6.4vw, 4.6rem)/1.04 var(--serif);
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      .display em {
        font-style: normal;
        background: linear-gradient(
          transparent 64%,
          var(--l) 64%,
          var(--l) 92%,
          transparent 92%
        );
        padding: 0 0.08em;
      }
      .lead {
        margin: 1.3rem 0 0;
        max-width: 34rem;
        font-size: clamp(1.08rem, 2.3vw, 1.28rem);
        line-height: 1.55;
        color: var(--muted);
      }
      .art {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.8rem;
        width: 100%;
        max-width: 390px;
        justify-self: end;
      }
      .tile {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        font: 600 clamp(1.8rem, 5vw, 3rem)/1 var(--serif);
        color: var(--i);
        background: var(--c);
      }
      .tile:nth-child(1) {
        border-radius: 50%;
      }
      .tile:nth-child(2) {
        border-radius: 30% 30% 30% 6%;
      }
      .tile:nth-child(3) {
        border-radius: 6% 30% 30% 30%;
      }
      .tile:nth-child(4) {
        border-radius: 30% 6% 30% 30%;
      }
      .tile:nth-child(5) {
        border-radius: 50%;
      }
      .tile:nth-child(6) {
        border-radius: 30%;
      }
      .cuts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: clamp(1.8rem, 4vw, 2.8rem);
      }
      .cut {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 1.4rem 1.4rem 1.2rem;
        border-radius: 24px;
        background: var(--t);
        color: var(--text);
        overflow: hidden;
        transition: transform 0.35s var(--ease);
        min-height: 210px;
      }
      .cut:hover {
        text-decoration: none;
        transform: translateY(-4px);
      }
      .cut::after {
        content: "";
        position: absolute;
        right: -34px;
        top: -34px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: var(--c);
        opacity: 0.55;
      }
      .cut .big {
        font: 650 3rem/1 var(--serif);
        color: var(--i);
        position: relative;
        z-index: 1;
      }
      .cut small {
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 0.72rem;
        color: var(--i);
      }
      .cut h3 {
        margin: 0.1rem 0;
        font: 650 1.4rem/1.15 var(--serif);
        letter-spacing: -0.01em;
      }
      .cut p {
        margin: 0;
        color: var(--muted);
        font-size: 0.93rem;
        line-height: 1.5;
      }
      .cut .meta {
        margin-top: auto;
        padding-top: 0.7rem;
        font-weight: 650;
        font-size: 0.88rem;
        color: var(--i);
      }
      .card {
        background: var(--surf);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }
      .prog {
        margin-top: 1rem;
        padding: 1.1rem 1.4rem;
        display: flex;
        align-items: center;
        gap: 1.2rem;
        flex-wrap: wrap;
      }
      .prog b {
        font: 650 1.8rem var(--serif);
      }
      .prog .u {
        color: var(--muted);
        font-weight: 500;
      }
      .tr {
        flex: 1;
        min-width: 140px;
        height: 10px;
        border-radius: 6px;
        background: var(--bg2);
        overflow: hidden;
      }
      .tr i {
        display: block;
        height: 100%;
        width: 100%;
        transform-origin: 0 50%;
        transform: scaleX(0);
        border-radius: 6px;
        background: linear-gradient(90deg, var(--a), var(--s), var(--k));
      }
      /* layout */
      .shell {
        max-width: 1240px;
        margin: 0 auto;
        padding: 1rem clamp(1rem, 3vw, 2rem) 2rem;
      }
      .content {
        min-width: 0;
      }
      .rail {
        display: none;
      }
      @media (min-width: 1060px) {
        .shell {
          display: grid;
          grid-template-columns: 250px minmax(0, 1fr);
          gap: 3.2rem;
          align-items: start;
        }
        .rail {
          display: block;
          position: sticky;
          top: calc(env(safe-area-inset-top, 0px) + 84px);
        }
        .fab,
        .nav .idx {
          display: none !important;
        }
      }
      .rl {
        font-weight: 700;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.6rem 0.8rem;
      }
      .rail a,
      .sheet a {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 0.8rem;
        border-radius: 14px;
        color: var(--muted);
        font-weight: 560;
        font-size: 0.95rem;
        line-height: 1.3;
      }
      .rail a:hover,
      .sheet a:hover {
        text-decoration: none;
        background: var(--bg2);
      }
      .rail a.act,
      .sheet a.act {
        background: var(--t);
        color: var(--i);
        font-weight: 700;
      }
      i.dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--c);
        flex: none;
      }
      .rprog {
        margin-top: 1.2rem;
        padding: 1rem 1.1rem;
      }
      .rprog b {
        font: 650 1.4rem var(--serif);
      }
      .rprog .u {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .rprog .tr {
        margin-top: 0.6rem;
      }
      /* chapters */
      .chapter {
        margin-bottom: clamp(3.2rem, 7vw, 5.5rem);
      }
      .chhead {
        position: relative;
        overflow: hidden;
        padding: clamp(1.5rem, 4vw, 2.4rem);
        border-radius: 28px;
        background: var(--t);
        margin-bottom: 1.4rem;
      }
      .chhead::before {
        content: "";
        position: absolute;
        right: -40px;
        top: -50px;
        width: 210px;
        height: 210px;
        border-radius: 50%;
        background: var(--c);
        opacity: 0.55;
      }
      .chhead::after {
        content: "";
        position: absolute;
        right: 70px;
        bottom: -34px;
        width: 84px;
        height: 84px;
        border-radius: 26px;
        background: var(--c);
        opacity: 0.35;
        transform: rotate(18deg);
      }
      .kick {
        position: relative;
        z-index: 1;
        font-weight: 700;
        font-size: 0.78rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--i);
      }
      .chapter > .chhead h1 {
        position: relative;
        z-index: 1;
        margin: 0.5rem 0 0;
        font: 650 clamp(1.9rem, 4.6vw, 2.9rem)/1.1 var(--serif);
        letter-spacing: -0.02em;
        max-width: 34rem;
        text-wrap: balance;
      }
      .chhead .sub {
        position: relative;
        z-index: 1;
        margin: 0.7rem 0 0;
        color: var(--muted);
        max-width: 32rem;
      }
      .chapter h2 {
        margin: clamp(2.2rem, 5vw, 3.2rem) 0 0.9rem;
        display: flex;
        gap: 0.7rem;
        align-items: center;
        flex-wrap: wrap;
        font: 650 clamp(1.35rem, 3vw, 1.75rem)/1.2 var(--serif);
        letter-spacing: -0.015em;
      }
      .chapter h2 .n {
        font: 700 0.8rem var(--sans);
        letter-spacing: 0.04em;
        color: var(--i);
        background: var(--t);
        padding: 0.32rem 0.65rem;
        border-radius: 999px;
      }
      .chapter p {
        margin: 0.8rem 0;
      }
      .chapter strong,
      .chapter b {
        font-weight: 650;
      }
      .chapter ul,
      .chapter ol {
        list-style: none;
        padding: 0;
        margin: 1rem 0;
        display: grid;
        gap: 0.55rem;
        counter-reset: n;
      }
      .chapter li {
        position: relative;
        padding: 0.75rem 1rem 0.75rem 3rem;
        border-radius: 16px;
        background: var(--surf);
        border: 1px solid var(--line);
      }
      .chapter ul > li::before {
        content: "";
        position: absolute;
        left: 1.15rem;
        top: 1.28rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--c);
      }
      .chapter ol > li {
        counter-increment: n;
      }
      .chapter ol > li::before {
        content: counter(n);
        position: absolute;
        left: 0.8rem;
        top: 0.7rem;
        width: 1.7rem;
        height: 1.7rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--t);
        color: var(--i);
        font: 700 0.85rem var(--sans);
      }
      .fgrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
        gap: 1rem;
        margin: 1.1rem 0;
      }
      .fcard {
        padding: 1.2rem 1.3rem;
        overflow-x: auto;
      }
      .fcard h4 {
        margin: 0 0 0.4rem;
        display: inline-block;
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        background: var(--t);
        color: var(--i);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .fgrid > .card:nth-child(1) {
        --t: var(--at);
        --i: var(--ai);
      }
      .fgrid > .card:nth-child(2) {
        --t: var(--st);
        --i: var(--si);
      }
      .fgrid > .card:nth-child(3) {
        --t: var(--kt);
        --i: var(--ki);
      }
      .fcard ul {
        margin: 0;
        gap: 0;
      }
      .fcard li {
        padding: 0.55rem 0 0.55rem 1.5rem;
        background: none;
        border: 0;
        border-bottom: 1px dashed var(--line);
        border-radius: 0;
      }
      .fcard li:last-child {
        border: 0;
      }
      .fcard li::before {
        left: 0 !important;
        top: 1.15rem !important;
        width: 8px !important;
        height: 8px !important;
      }
      .fcard p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      /* callouts */
      .co {
        display: flex;
        gap: 1rem;
        align-items: flex-start;
        margin: 1.2rem 0;
        padding: 1.1rem 1.25rem;
        border-radius: 20px;
        background: var(--t);
        border: 1px solid var(--c);
      }
      .co .ic {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        display: grid;

    <script>
      const r = String.raw;
      const T = [
        {
          id: "componentes",
          n: "Componentes, ángulo y resultante",
          intro: [
            r`Un vector tiene <b>magnitud</b> y <b>dirección</b>. Para trabajar con él lo descomponemos en una parte horizontal $A_x$ y una vertical $A_y$: el vector es la hipotenusa de un triángulo rectángulo y las componentes son sus catetos.`,
            r`$$A_x=A\cos\theta\qquad A_y=A\sin\theta$$`,
            r`Al revés, si conoces las componentes, la magnitud sale por Pitágoras y el ángulo con la tangente inversa de $y/x$:`,
            r`$$A=\sqrt{A_x^2+A_y^2}\qquad \theta=\tan^{-1}\!\left(\frac{A_y}{A_x}\right)$$`,
            r`<div class="tip"><b>Cuidado con el cuadrante.</b> La calculadora entrega $\theta$ entre $-90^\circ$ y $90^\circ$. Si $A_x\lt0$, suma $180^\circ$ al resultado para obtener el ángulo medido desde $+x$.</div>`,
          ],
          ex: [
            [
              r`Un vector de $50\,\text{N}$ forma $30^\circ$ con el eje $x$. Calcula $A_x$.`,
              43.3,
              "N",
              r`$A_x=A\cos\theta=50\cos30^\circ=\mathbf{43.30\ N}$`,
            ],
            [
              r`Una velocidad de $20\,\text{m/s}$ apunta $53^\circ$ sobre la horizontal. Calcula $v_y$.`,
              15.97,
              "m/s",
              r`$v_y=20\sin53^\circ=20(0.7986)=\mathbf{15.97\ m/s}$`,
            ],
            [
              r`Un vector tiene $A_x=6$ y $A_y=8$. Calcula su magnitud.`,
              10,
              "",
              r`$A=\sqrt{6^2+8^2}=\sqrt{100}=\mathbf{10}$`,
            ],
            [
              r`Un vector tiene $A_x=-4$ y $A_y=3$. Calcula su ángulo desde $+x$ ($0^\circ$ a $360^\circ$).`,
              143.13,
              "°",
              r`$\tan^{-1}(3/-4)=-36.87^\circ$<br>Como $A_x\lt0$, suma $180^\circ$: $\theta=\mathbf{143.13^\circ}$`,
            ],
            [
              r`Un vector tiene $A_x=5$ y $A_y=-12$. Calcula $\theta=\tan^{-1}(A_y/A_x)$.`,
              -67.38,
              "°",
              r`$\theta=\tan^{-1}(-2.4)=\mathbf{-67.38^\circ}$, equivalente a $292.62^\circ$`,
            ],
          ],
        },
        {
          id: "combinacion",
          n: "Combinación de vectores",
          intro: [
            r`Para sumar vectores se suman sus <b>componentes</b> por separado; nunca se suman las magnitudes directamente. Si un vector viene como magnitud y ángulo, primero se descompone.`,
            r`$$R_x=\sum A_x\qquad R_y=\sum A_y$$`,
            r`$$R=\sqrt{R_x^2+R_y^2}\qquad \theta_R=\tan^{-1}\!\left(\frac{R_y}{R_x}\right)$$`,
            r`La resta es la suma del opuesto: $\vec A-\vec B=\vec A+(-\vec B)$, es decir, se resta componente a componente. Lo mismo aplica a combinaciones como $2\vec A-\vec B$.`,
          ],
          ex: [
            [
              r`$\vec A=(3,4)$ y $\vec B=(1,-2)$. Calcula $|\vec A+\vec B|$.`,
              4.47,
              "",
              r`$\vec R=(4,2)$<br>$|\vec R|=\sqrt{16+4}=\mathbf{4.47}$`,
            ],
            [
              r`$A=10\,\text{N}$ a $0^\circ$ y $B=10\,\text{N}$ a $90^\circ$. Calcula la magnitud de la resultante.`,
              14.14,
              "N",
              r`$\vec R=(10,10)$, $|\vec R|=\sqrt{200}=\mathbf{14.14\ N}$`,
            ],
            [
              r`$A=8\,\text{N}$ a $0^\circ$ y $B=6\,\text{N}$ a $90^\circ$. Calcula el ángulo de la resultante.`,
              36.87,
              "°",
              r`$\vec R=(8,6)$, $\theta=\tan^{-1}(6/8)=\mathbf{36.87^\circ}$`,
            ],
            [
              r`$\vec A=(5,2)$ y $\vec B=(2,6)$. Calcula $|\vec A-\vec B|$.`,
              5,
              "",
              r`$\vec D=(3,-4)$, $|\vec D|=\sqrt{9+16}=\mathbf{5}$`,

      function upd() {
        document
          .querySelectorAll(".progn")
          .forEach((e) => (e.textContent = done));
        document
          .querySelectorAll(".progb")
          .forEach((e) => (e.style.transform = `scaleX(${done / total})`));
      }
      function vals(s) {
        s = s.replace(/−/g, "-").trim();
        const o = [],
          plain = parseFloat(s.replace(/\s/g, "").replace(",", "."));
        if (!isNaN(plain)) o.push(plain);
        if (
          /^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s) ||
          /^-?[1-9]\d{0,2}(\s\d{3})+$/.test(s)
        )
          o.push(parseFloat(s.replace(/[.\s]/g, "")));
        return o;
      }
      function fbk(c, t, k) {
        const f = c.querySelector(".fb");
        f.className = "fb " + k;
        f.textContent = t;
      }
      function check(c) {
        const v = vals(c.querySelector("input").value),
          a = parseFloat(c.dataset.a);
        if (!v.length) return fbk(c, "Escribe un número.", "mid");
        if (
          v.some((x) => Math.abs(x - a) <= Math.max(Math.abs(a) * 0.015, 0.02))
        ) {
          fbk(c, "Correcto", "ok");
          if (!c.dataset.done) {
            c.dataset.done = 1;
            done++;
            upd();
          }
        } else
          fbk(
            c,
            "Aún no. Revisa la solución paso a paso e inténtalo de nuevo.",
            "bad",
          );
      }
      const contentEl = document.getElementById("content");
      contentEl.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const c = b.closest(".ex");
        if (b.dataset.k === "go") check(c);
        else if (b.dataset.k === "sol") {
          const s = c.querySelector(".sol");
          s.hidden = !s.hidden;
          b.textContent = s.hidden ? "Ver solución" : "Ocultar solución";
        }
      });
      contentEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.tagName === "INPUT")
          check(e.target.closest(".ex"));
      });
    </script>
  </body>
</html>
